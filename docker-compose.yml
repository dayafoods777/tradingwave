services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: tradingwave_postgres
    restart: always
    environment:
      POSTGRES_USER: twave_user
      POSTGRES_PASSWORD: twave_password
      POSTGRES_DB: tradingwave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./TradingWave_Research_and_Development/05_DATABASE_DESIGN/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twave_user -d tradingwave"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradingwave_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: tradingwave_centrifugo
    restart: always
    volumes:
      - ./docker/centrifugo.json:/centrifugo/config.json
    command: centrifugo -c config.json
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

